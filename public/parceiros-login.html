<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso de Parceiros — F&G Seguro Garantia</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       Entrada do parceiro — a primeira tela que ele vê. Mesma identidade
       dos portais: superfície clara, cantos arredondados, sombra em
       camadas, uma única curva de transição (--ease).
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --navy: #1B263B;
      --navy-soft: #25334f;
      --gold: #C69C6D;
      --ink: #14203a;
      --muted: #7b8698;
      --line: rgba(27,38,59,.08);
      --bg: #f6f3ee;
      --shadow-lg: 0 2px 6px rgba(27,38,59,.06), 0 28px 60px -28px rgba(27,38,59,.32);
      --ease: cubic-bezier(.22,.61,.36,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    /* Brilho difuso atrás do cartão — o fundo deixa de ser chapado */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(780px 480px at 50% 18%, rgba(198,156,109,.18), transparent 64%);
    }

    .card {
      position: relative; width: 100%; max-width: 420px;
      background: #fff; border-radius: 28px; padding: 42px 38px 36px;
      box-shadow: var(--shadow-lg);
      animation: entra .55s var(--ease) both;
    }
    @keyframes entra { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }

    .logo {
      width: 58px; height: 58px; margin: 0 auto 20px;
      background: var(--navy); color: var(--gold); border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; letter-spacing: .5px;
    }
    h1 { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -.4px; color: var(--navy); }
    .sub { text-align: center; font-size: 13px; color: var(--muted); margin: 6px 0 30px; }

    label {
      display: block; font-size: 11.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 8px;
    }
    input {
      width: 100%; padding: 14px 17px; margin-bottom: 18px;
      border: 1px solid var(--line); border-radius: 999px;
      font: inherit; font-size: 14.5px; color: var(--ink);
      background: #faf8f5; outline: none;
      transition: border-color .24s var(--ease), background .24s var(--ease), box-shadow .24s var(--ease);
    }
    input::placeholder { color: #b3b9c4; }
    input:focus {
      border-color: var(--gold); background: #fff;
      box-shadow: 0 0 0 4px rgba(198,156,109,.14);
    }

    button {
      width: 100%; padding: 15px; margin-top: 4px;
      background: var(--navy); color: #fff; border: none; border-radius: 999px;
      font: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer;
      transition: transform .24s var(--ease), background .24s var(--ease);
    }
    button:hover:not(:disabled) { background: var(--navy-soft); transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .erro {
      display: none; margin-top: 14px; padding: 12px 15px;
      background: #fdecec; border-radius: 14px;
      font-size: 12.5px; color: #b5352f; text-align: center; line-height: 1.5;
      animation: entra .34s var(--ease) both;
    }
    .erro a { color: #8a2f2a; font-weight: 600; text-decoration: underline; }

    .link-forgot { text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--muted); }
    .link-forgot a {
      color: var(--gold); font-weight: 500; cursor: pointer; text-decoration: none;
      border-bottom: 1px solid transparent; transition: border-color .24s var(--ease);
    }
    .link-forgot a:hover { border-bottom-color: var(--gold); }

    .forgot-form { display: none; margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
    .msg-ok {
      display: none; margin-top: 14px; padding: 12px 15px;
      background: #eef7f0; border-radius: 14px;
      font-size: 12.5px; color: #1f6b3c; text-align: center; line-height: 1.5;
      animation: entra .34s var(--ease) both;
    }
    .msg-ok .ico { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
    .ico {
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .ico-sprite { display: none; }

    @media (max-width: 460px) {
      .card { padding: 34px 24px 30px; border-radius: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <svg class="ico-sprite" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.4 12.3 2.5 2.5 4.7-5"/></symbol>
  </svg>

  <div class="card">
    <div class="logo">F&G</div>
    <h1>Área do Parceiro</h1>
    <p class="sub">F&G Seguro Garantia</p>

    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" placeholder="Seu usuário" autocomplete="username" />

    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" />

    <button id="btn-login" onclick="login()">Entrar</button>

    <div class="erro" id="erro">
      Usuário ou senha incorretos.
      <a href="https://wa.me/5515998618659?text=Preciso+de+ajuda+para+acessar+o+portal+de+parceiros" target="_blank" rel="noopener">Precisa de ajuda?</a>
    </div>
    <div class="link-forgot"><a onclick="toggleForgot()">Esqueci minha senha</a></div>

    <!-- Formulário recuperação -->
    <div class="forgot-form" id="forgot-form">
      <label for="forgot-email">E-mail cadastrado</label>
      <input type="email" id="forgot-email" placeholder="seu@email.com" />
      <button onclick="recuperarSenha()" id="btn-forgot">Enviar minha senha</button>
      <div class="msg-ok" id="msg-ok">
        <svg class="ico"><use href="#i-check"/></svg>
        Se o e-mail estiver cadastrado, você receberá suas credenciais em instantes.
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hfjvwibucplyhsvnwfor.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmanZ3aWJ1Y3BseWhzdm53Zm9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzODA4NTIsImV4cCI6MjA4Nzk1Njg1Mn0.jCBS1YnDcKuVzJSVhGiJM0kyafPMZxFi52kszTJCxZQ';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Se já logado, redireciona conforme o tipo
    const sessaoExistente = localStorage.getItem('parceiro_session');
    if (sessaoExistente) {
      const s = JSON.parse(sessaoExistente);
      window.location.href = s.partner_type === 'imobiliaria' ? 'imobiliaria.html' : 'parceiros.html';
    }

    document.getElementById('senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btn-login');
      const erro = document.getElementById('erro');
      erro.style.display = 'none';
      if (!usuario || !senha) return;
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      // Autenticação server-side via Edge Function — senha nunca comparada via anon key
      let data = null;
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/parceiro-auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
          body: JSON.stringify({ usuario, senha }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Credenciais inválidas');
        data = json.partner;
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        erro.style.display = 'block';
        return;
      }

      btn.disabled = false;
      btn.textContent = 'Entrar';

      localStorage.setItem('parceiro_session', JSON.stringify(data));
      if (data.partner_type === 'imobiliaria') {
        window.location.href = 'imobiliaria.html';
      } else {
        window.location.href = 'parceiros.html';
      }
    }

    function toggleForgot() {
      const f = document.getElementById('forgot-form');
      f.style.display = f.style.display === 'none' || !f.style.display ? 'block' : 'none';
    }

    async function recuperarSenha() {
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) return;
      const btn = document.getElementById('btn-forgot');
      btn.disabled = true; btn.textContent = 'Enviando...';

      await fetch('https://hfjvwibucplyhsvnwfor.supabase.co/functions/v1/parceiro-forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });

      btn.disabled = false; btn.textContent = 'Enviar minha senha';
      document.getElementById('msg-ok').style.display = 'block';
      document.getElementById('forgot-email').value = '';
    }
  </script>
</body>
</html>
