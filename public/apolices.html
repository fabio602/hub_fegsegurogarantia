<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Apólices — F&G Seguro Garantia</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       Consulta pública de apólices — mesma identidade dos demais
       portais F&G: superfícies claras, cantos arredondados, sombras em
       camadas no lugar de bordas duras, uma única curva de transição.
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --navy: #1B263B;
      --navy-soft: #25334f;
      --gold: #C69C6D;
      --ink: #14203a;
      --muted: #7b8698;
      --line: rgba(27,38,59,.08);
      --surface: #ffffff;
      --bg: #f6f3ee;
      --shadow-sm: 0 1px 2px rgba(27,38,59,.04);
      --shadow: 0 1px 3px rgba(27,38,59,.05), 0 12px 32px -16px rgba(27,38,59,.22);
      --shadow-lg: 0 2px 6px rgba(27,38,59,.06), 0 28px 60px -28px rgba(27,38,59,.32);
      --ease: cubic-bezier(.22,.61,.36,1);
      --r-lg: 26px;
      --r: 18px;
      --r-sm: 13px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; padding: 56px 20px 120px;
      -webkit-font-smoothing: antialiased;
    }
    /* Brilho difuso no topo — tira o "chapado" do fundo sólido */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(900px 460px at 50% -8%, rgba(198,156,109,.16), transparent 62%);
    }
    .container { max-width: 780px; margin: 0 auto; position: relative; z-index: 1; }

    /* ── ÍCONES (SVG traçado, herdam a cor do texto) ── */
    .ico-sprite { display: none; }
    .ico {
      width: 17px; height: 17px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .ico-inline { width: 14px; height: 14px; vertical-align: -2px; }
    .ico-lg { width: 22px; height: 22px; }

    /* ── CABEÇALHO ── */
    .header { text-align: center; margin-bottom: 34px; animation: entra .5s var(--ease) both; }
    .logo {
      width: 62px; height: 62px; margin: 0 auto 18px;
      background: var(--navy); color: var(--gold);
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 700; letter-spacing: .5px;
      box-shadow: var(--shadow);
    }
    .header h1 { font-size: 27px; font-weight: 700; letter-spacing: -.5px; color: var(--navy); }
    .header p { font-size: 14px; color: var(--muted); margin-top: 7px; }

    @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* ── BUSCA ── */
    .search-card {
      background: var(--surface); border-radius: var(--r-lg);
      padding: 30px 32px 32px; box-shadow: var(--shadow); margin-bottom: 30px;
      animation: entra .5s var(--ease) .06s both;
    }
    .search-card label {
      display: block; font-size: 11.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 10px;
    }
    .input-row { display: flex; gap: 11px; }
    .input-row input {
      flex: 1; min-width: 0; padding: 15px 18px;
      border: 1px solid var(--line); border-radius: 999px;
      font: inherit; font-size: 15px; color: var(--ink);
      background: #faf8f5; outline: none;
      transition: border-color .24s var(--ease), background .24s var(--ease), box-shadow .24s var(--ease);
    }
    .input-row input::placeholder { color: #b3b9c4; }
    .input-row input:focus {
      border-color: var(--gold); background: #fff;
      box-shadow: 0 0 0 4px rgba(198,156,109,.14);
    }
    .input-row button {
      padding: 15px 30px; background: var(--navy); color: #fff;
      border: none; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap;
      transition: transform .24s var(--ease), background .24s var(--ease);
    }
    .input-row button:hover:not(:disabled) { background: var(--navy-soft); transform: translateY(-1px); }
    .input-row button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ── MENSAGENS / ESTADO VAZIO ── */
    .msg {
      text-align: center; padding: 44px 24px; font-size: 14px; color: var(--muted);
      background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
      animation: entra .42s var(--ease) both;
    }
    .msg .chip {
      width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: #f2ede5; color: var(--gold);
    }
    .msg .chip .ico { width: 25px; height: 25px; }
    .msg strong { display: block; font-size: 15.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
    .msg.error .chip { background: #fdecec; color: #d34a4a; }
    .msg.error strong { color: #b5352f; }

    /* ── RESULTADOS ── */
    .results { display: flex; flex-direction: column; gap: 15px; }
    .apolice-card {
      background: var(--surface); border-radius: var(--r); padding: 24px 26px;
      box-shadow: var(--shadow-sm);
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 18px; flex-wrap: wrap;
      transition: transform .3s var(--ease), box-shadow .3s var(--ease);
      animation: entra .5s var(--ease) both;
    }
    .apolice-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    /* Cascata: cada cartão entra um pouquinho depois do anterior */
    .apolice-card:nth-child(1) { animation-delay: .04s; }
    .apolice-card:nth-child(2) { animation-delay: .09s; }
    .apolice-card:nth-child(3) { animation-delay: .14s; }
    .apolice-card:nth-child(4) { animation-delay: .19s; }
    .apolice-card:nth-child(n+5) { animation-delay: .24s; }

    .apolice-info { min-width: 0; flex: 1; }
    .apolice-info .empresa { font-size: 16.5px; font-weight: 600; color: var(--navy); letter-spacing: -.2px; }
    .apolice-info .segurado { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
    .apolice-info .segurado strong { color: var(--ink); font-weight: 500; }
    .apolice-info .meta {
      font-size: 12.5px; color: var(--muted); margin-top: 12px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    }
    .meta-item { display: inline-flex; align-items: center; gap: 6px; }
    .meta-item .ico { color: var(--gold); }
    .badge {
      display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 500; letter-spacing: .2px;
      background: #f2ede5; color: #8a6a3f;
    }

    /* ── BOTÕES DE DOWNLOAD ── */
    .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .btn-download {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 18px; background: var(--navy); color: #fff;
      border-radius: 999px; font-size: 12.5px; font-weight: 500;
      text-decoration: none; white-space: nowrap;
      transition: transform .24s var(--ease), background .24s var(--ease);
    }
    .btn-download:hover { background: var(--navy-soft); transform: translateY(-1px); }
    .btn-boleto { background: #2f4470; }
    .btn-boleto:hover { background: #3a5185; }
    .btn-vencido { background: #b5352f; }
    .btn-vencido:hover { background: #c94039; }
    .boleto-wrap { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 5px; }
    .aviso-aberto {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10.5px; font-weight: 500; color: #b5352f;
      background: #fdecec; padding: 3px 10px; border-radius: 999px;
    }

    .footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--muted); }

    /* ── WHATSAPP FLUTUANTE ── */
    .whatsapp-btn {
      position: fixed; bottom: 26px; right: 26px; z-index: 100;
      display: flex; align-items: center; gap: 10px;
      background: #1f9d55; color: #fff; text-decoration: none;
      font-size: 13px; font-weight: 500;
      padding: 13px 22px; border-radius: 999px;
      box-shadow: 0 4px 14px rgba(31,157,85,.28), 0 16px 40px -18px rgba(31,157,85,.6);
      transition: transform .28s var(--ease), box-shadow .28s var(--ease);
    }
    .whatsapp-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(31,157,85,.34), 0 22px 50px -20px rgba(31,157,85,.7); }
    .whatsapp-btn svg { width: 21px; height: 21px; flex-shrink: 0; }

    @media (max-width: 640px) {
      body { padding: 34px 15px 110px; }
      .search-card { padding: 24px 20px 26px; }
      .input-row { flex-direction: column; }
      .apolice-card { padding: 20px; }
      .btns { width: 100%; }
      .whatsapp-btn { bottom: 16px; right: 16px; padding: 12px 18px; }
    }
    /* Alvo de toque mínimo confortável no celular */
    @media (pointer: coarse) {
      .btn-download { padding: 12px 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- ═══ ÍCONES ═══
       Um sprite só: cada símbolo é traçado com currentColor, então herda a
       cor e o hover de onde for usado. -->
  <svg class="ico-sprite" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-predio" viewBox="0 0 24 24"><path d="M4 21V6a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15"/><path d="M13 10h6a1 1 0 0 1 1 1v10"/><path d="M2 21h20"/><path d="M7 9h2M7 13h2M7 17h2M16 14h1M16 18h1"/></symbol>
    <symbol id="i-calendario" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-moeda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.6 9.4a2.6 2.6 0 0 0-2.6-1.6c-1.5 0-2.6.9-2.6 2.1 0 2.9 5.2 1.6 5.2 4.5 0 1.2-1.1 2.1-2.6 2.1a2.7 2.7 0 0 1-2.7-1.7"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
    <symbol id="i-baixar" viewBox="0 0 24 24"><path d="M12 4v12M8 12l4 4 4-4"/><path d="M4 20h16"/></symbol>
    <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3.6 2.8 19.2A1 1 0 0 0 3.7 20.7h16.6a1 1 0 0 0 .9-1.5L12 3.6z"/><path d="M12 9.5v4.2M12 17.2h.01"/></symbol>
    <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
    <symbol id="i-relogio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3.2 2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></symbol>
  </svg>

  <div class="container">
    <div class="header">
      <div class="logo">F&G</div>
      <h1>Minhas Apólices</h1>
      <p>F&G Corretora de Seguros — consulte suas apólices pelo CNPJ</p>
    </div>

    <div class="search-card">
      <label for="cnpj-input">CNPJ da empresa</label>
      <div class="input-row">
        <input type="text" id="cnpj-input" placeholder="00.000.000/0000-00" maxlength="18" inputmode="numeric" oninput="mascara(this)" onkeydown="if(event.key==='Enter') buscar()" />
        <button id="btn-buscar" onclick="buscar()">Buscar</button>
      </div>
    </div>

    <div id="resultado"></div>

    <div class="footer">F&G Corretora de Seguros · Acesso exclusivo ao titular do CNPJ</div>
  </div>

  <a href="https://wa.me/5515998618659?text=Ol%C3%A1!%20Preciso%20de%20ajuda%20com%20minhas%20ap%C3%B3lices." target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    Fale com a F&amp;G
  </a>

  <script>
    const SUPABASE_URL = 'https://hfjvwibucplyhsvnwfor.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmanZ3aWJ1Y3BseWhzdm53Zm9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzODA4NTIsImV4cCI6MjA4Nzk1Njg1Mn0.jCBS1YnDcKuVzJSVhGiJM0kyafPMZxFi52kszTJCxZQ';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /** Mensagem de estado (vazio, erro, carregando) no mesmo formato visual. */
    function estado(icone, titulo, texto, erro) {
      return `<div class="msg${erro ? ' error' : ''}">
        <div class="chip"><svg class="ico"><use href="#i-${icone}"/></svg></div>
        <strong>${titulo}</strong>
        ${texto || ''}
      </div>`;
    }

    function mascara(el) {
      let v = el.value.replace(/\D/g, '').substring(0, 14);
      v = v.replace(/^(\d{2})(\d)/, '$1.$2');
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
      v = v.replace(/(\d{4})(\d)/, '$1-$2');
      el.value = v;
    }

    function cnpjRaw(v) {
      return v.replace(/\D/g, '');
    }

    function fmtData(d) {
      if (!d) return '—';
      const [y, m, day] = d.split('-');
      return `${day}/${m}/${y}`;
    }

    function fmtMoeda(v) {
      if (!v) return null;
      // Remove tudo exceto dígitos, vírgula e ponto
      let s = String(v).replace(/[^0-9,.]/g, '');
      // Formato BR: ponto = milhar, vírgula = decimal → remove pontos, troca vírgula por ponto
      s = s.replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      if (isNaN(n) || n === 0) return null;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function buscar() {
      const alvo = document.getElementById('resultado');
      const raw = cnpjRaw(document.getElementById('cnpj-input').value);
      if (raw.length < 14) {
        alvo.innerHTML = estado('alerta', 'CNPJ incompleto', 'Digite os 14 dígitos do CNPJ da empresa.', true);
        return;
      }

      const btn = document.getElementById('btn-buscar');
      btn.disabled = true;
      btn.textContent = 'Buscando...';
      alvo.innerHTML = estado('relogio', 'Consultando...', 'Buscando as apólices deste CNPJ.');

      const cnpjFormatado = document.getElementById('cnpj-input').value;

      // Buscar vendas pelo CNPJ (com ou sem formatação)
      const { data, error } = await client
        .from('sales')
        .select('id, data, nome, product_type, tipo, seguradora, segurado, premio, vigencia_inicio, vigencia_fim, apolice_url')
        .or(`cnpj.eq.${raw},cnpj.eq.${cnpjFormatado}`)
        .eq('vendeu', 'Sim');

      btn.disabled = false;
      btn.textContent = 'Buscar';

      if (error) {
        alvo.innerHTML = estado('x', 'Não conseguimos consultar agora', 'Tente novamente em instantes ou fale com a F&amp;G pelo WhatsApp.', true);
        return;
      }

      if (!data || data.length === 0) {
        alvo.innerHTML = estado('busca', 'Nenhuma apólice para este CNPJ', 'Confira o número digitado. Se estiver certo, fale com a F&amp;G pelo WhatsApp.');
        return;
      }

      // Buscar boletos para todas as vendas
      const ids = data.map(a => a.id);
      const { data: bData } = await client
        .from('boletos')
        .select('sale_id, parcela, vencimento, url, pago')
        .in('sale_id', ids)
        .order('parcela');

      const bMap = {};
      (bData || []).forEach(b => {
        if (!bMap[b.sale_id]) bMap[b.sale_id] = [];
        bMap[b.sale_id].push(b);
      });

      // Filtrar apenas registros que têm apólice OU boleto
      const comDocumentos = data.filter(a => a.apolice_url || (bMap[a.id] && bMap[a.id].length > 0));

      if (comDocumentos.length === 0) {
        alvo.innerHTML = estado('doc', 'Ainda não há documentos disponíveis', 'Encontramos o CNPJ, mas a apólice ou os boletos ainda não foram anexados.');
        return;
      }

      alvo.innerHTML = `
        <div class="results">
          ${comDocumentos.map(a => {
            const produto = a.product_type || a.tipo || '—';
            const vigencia = (a.vigencia_inicio || a.vigencia_fim)
              ? `${fmtData(a.vigencia_inicio)} até ${fmtData(a.vigencia_fim)}`
              : null;
            const premio = fmtMoeda(a.premio);
            const boletos = bMap[a.id] || [];

            const btnApolice = a.apolice_url
              ? `<a href="${a.apolice_url}" target="_blank" rel="noopener noreferrer" class="btn-download">
                  <svg class="ico ico-inline"><use href="#i-baixar"/></svg> Apólice
                </a>`
              : '';

            const hoje = new Date().toISOString().slice(0, 10);
            const btnsBoleto = boletos.map(b => {
              const emAberto = !b.pago && b.vencimento && b.vencimento < hoje;
              return `<div class="boleto-wrap">
                <a href="${b.url}" target="_blank" rel="noopener noreferrer" class="btn-download btn-boleto${emAberto ? ' btn-vencido' : ''}">
                  <svg class="ico ico-inline"><use href="#i-baixar"/></svg>
                  Boleto ${b.parcela}${b.vencimento ? ' <span style="opacity:.75">(' + fmtData(b.vencimento) + ')</span>' : ''}
                </a>
                ${emAberto ? '<span class="aviso-aberto"><svg class="ico ico-inline"><use href="#i-alerta"/></svg> Em aberto</span>' : ''}
              </div>`;
            }).join('');

            return `
            <div class="apolice-card">
              <div class="apolice-info">
                <div class="empresa">${a.nome || '—'}</div>
                ${a.segurado ? `<div class="segurado">Segurado: <strong>${a.segurado}</strong></div>` : ''}
                <div class="meta">
                  <span class="badge">${produto}</span>
                  ${a.seguradora ? `<span class="meta-item"><svg class="ico ico-inline"><use href="#i-predio"/></svg> ${a.seguradora}</span>` : ''}
                  ${vigencia ? `<span class="meta-item"><svg class="ico ico-inline"><use href="#i-calendario"/></svg> ${vigencia}</span>` : ''}
                  ${premio ? `<span class="meta-item"><svg class="ico ico-inline"><use href="#i-moeda"/></svg> ${premio}</span>` : ''}
                  <span class="meta-item"><svg class="ico ico-inline"><use href="#i-doc"/></svg> Emitida em ${fmtData(a.data)}</span>
                </div>
              </div>
              <div class="btns">${btnApolice}${btnsBoleto}</div>
            </div>
            `;
          }).join('')}
        </div>
      `;
    }
  </script>
</body>
</html>
