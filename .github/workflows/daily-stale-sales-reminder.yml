          curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/imobiliaria-repasse-aviso" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            --data '{}' | tee /dev/stderr

      - name: Call Edge Function (inadimplentes follow-up)
