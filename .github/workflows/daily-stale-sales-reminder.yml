            exit 1
          fi
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/post-sale-onboarding" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
